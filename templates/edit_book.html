{% extends "base.html" %}
{% block title %}Kitabı düzenle · Kitap Takip{% endblock %}
{% block content %}
<div class="detail-back"><a href="{{ url_for('book_detail', book_id=book.id) }}"><i class="bi bi-arrow-left"></i> Kitaba dön</a></div>
<section class="card edit-book-panel">
  <div class="card-body">
    <p class="eyebrow">KİTAP BİLGİLERİ</p><h1 class="h3 mb-4">Kitabı düzenle</h1>
    <form method="post">
      <div class="row g-3">
        <div class="col-md-8"><label class="form-label" for="title">Kitap adı *</label><input class="form-control" id="title" name="title" value="{{ book.title }}" maxlength="250" required></div>
        <div class="col-md-4"><label class="form-label" for="author">Yazar</label><input class="form-control" id="author" name="author" value="{{ book.author }}" maxlength="200"></div>
        <div class="col-md-6"><label class="form-label" for="publisher">Yayınevi</label><input class="form-control" id="publisher" name="publisher" value="{{ book.publisher }}" maxlength="200"></div>
        <div class="col-md-3"><label class="form-label" for="total_pages">Toplam sayfa *</label><input class="form-control" id="total_pages" name="total_pages" type="number" min="{{ book.current_page or 1 }}" value="{{ book.total_pages }}" required><div class="form-text">Mevcut ilerlemen {{ book.current_page }} sayfa.</div></div>
        <div class="col-md-3"><label class="form-label" for="publication_year">Yayın yılı</label><input class="form-control" id="publication_year" name="publication_year" value="{{ book.publication_year }}" maxlength="20"></div>
        <div class="col-md-6"><label class="form-label" for="isbn">ISBN</label><input class="form-control" id="isbn" name="isbn" value="{{ book.isbn }}" maxlength="30"></div>
        <div class="col-md-6"><label class="form-label" for="source_url">Kitapyurdu bağlantısı</label><input class="form-control" id="source_url" name="source_url" type="url" value="{{ book.source_url }}"></div>
        <div class="col-12"><label class="form-label" for="cover_url">Kapak görseli bağlantısı</label><input class="form-control" id="cover_url" name="cover_url" type="url" value="{{ book.cover_url }}"></div>
      </div>
      <div class="d-flex gap-2 mt-4"><button class="btn btn-primary" type="submit">Değişiklikleri kaydet</button><a class="btn btn-light" href="{{ url_for('book_detail', book_id=book.id) }}">Vazgeç</a></div>
    </form>
  </div>
</section>
{% endblock %}
